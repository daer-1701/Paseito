<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis · Paseo Aranjuez</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e9edf3; background: #101824; }
    body { margin: 0; }
    main { max-width: 760px; margin: auto; padding: 28px 18px 70px; }
    h1 { margin-bottom: 4px; font-size: 2rem; }
    p { color: #aeb9c7; }
    #status { font-size: .9rem; }
    #conversation { min-height: 330px; max-height: 58vh; overflow: auto; padding: 16px; border: 1px solid #344256; border-radius: 16px; background: #172231; }
    .turn { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
    .user { background: #27456b; margin-left: 12%; }
    .assistant { background: #263444; margin-right: 12%; }
    .label { display: block; margin-bottom: 5px; color: #aeb9c7; font-size: .8rem; font-weight: 700; text-transform: uppercase; }
    .sources { font-size: .85rem; margin: -9px 0 16px 14px; color: #b9c6d5; }
    .sources a { color: #8ed4ff; }
    form { display: flex; gap: 8px; margin-top: 16px; }
    input { flex: 1; min-width: 0; padding: 13px; color: inherit; background: #172231; border: 1px solid #526278; border-radius: 10px; font: inherit; }
    button { padding: 11px 16px; color: #101824; background: #84d8d0; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #record { margin-top: 10px; background: #eebf82; }
    #record.active { background: #f08f8f; }
    #recordHint { margin-left: 10px; font-size: .9rem; color: #aeb9c7; }
    audio { display: block; margin-top: 12px; max-width: 100%; }
    audio[hidden] { display: none; }
    .note { font-size: .85rem; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Jarvis</h1>
    <p>Asistente del Paseo Aranjuez · demo de integración</p>
    <p id="status" role="status">Comprobando servicios…</p>
    <section id="conversation" aria-label="Conversación"></section>
    <form id="chatForm">
      <input id="message" autocomplete="off" maxlength="2000" aria-label="Mensaje" placeholder="Pregunta por negocios, productos o eventos" required>
      <button id="send" type="submit">Enviar</button>
    </form>
    <button id="record" type="button" disabled>Iniciar voz</button><span id="recordHint"></span>
    <audio id="spokenAudio" controls hidden aria-label="Respuesta hablada de Jarvis"></audio>
    <p class="note">Los registros iniciales son ficticios. Jarvis muestra las fuentes de cada respuesta.</p>
  </main>
</body>
</html>

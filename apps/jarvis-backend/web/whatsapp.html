<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis · Respaldo del canal de mensajes</title>
<style>
:root { color-scheme: light; --ink:#22372f; --green:#165b45; --line:#d3ddd5; }
* { box-sizing:border-box; }
body { margin:0; font:16px/1.5 "Segoe UI",system-ui,sans-serif; background:#ecefe9; color:var(--ink); }
main { width:min(100%,720px); height:100dvh; margin:auto; display:flex; flex-direction:column; background:#f6f3eb; }
header { display:flex; align-items:center; gap:14px; background:var(--green); color:white; padding:16px 20px; }
.avatar { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:#e4b544; color:#342420; font-weight:800; font-size:22px; }
h1 { font-size:26px; margin:0; } header p { font-size:13px; margin:0; opacity:.9; }
button, input { font:inherit; } button { cursor:pointer; min-height:44px; border:1px solid var(--line); background:white; color:var(--ink); border-radius:8px; padding:8px 12px; }
button:disabled { cursor:wait; opacity:.55; } button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #bf8b16; outline-offset:3px; }
#restart { margin-left:auto; background:transparent; color:white; border-color:#ffffff70; }
.notice { padding:10px 18px; background:#fff5d9; color:#54431c; font-size:13px; border-bottom:1px solid #ebdfbd; }
.notice a { color:inherit; }
#messages { flex:1; min-height:0; overflow-y:auto; padding:24px 18px; display:flex; flex-direction:column; gap:14px; }
.bubble { padding:12px 16px; max-width:90%; border-radius:12px; overflow-wrap:anywhere; white-space:pre-wrap; background:white; border:1px solid #e1e3dc; align-self:flex-start; }
.bubble.user { background:#d5ead4; border-color:#c4d9c3; align-self:flex-end; }
.bubble.error { color:#81382a; }
#choices { display:flex; gap:8px; overflow-x:auto; padding:8px 16px; } #choices:empty { display:none; } #choices button { flex:none; }
form { display:flex; align-items:center; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#e7ece5; }
input { min-width:0; flex:1; padding:12px; border:1px solid var(--line); border-radius:8px; background:white; font-size:16px; }
#send { background:var(--green); color:white; border-color:var(--green); }
#status { padding:0 16px 8px; font-size:13px; background:#e7ece5; min-height:28px; }
@media(min-width:760px) { body { padding:20px; } main { height:calc(100dvh - 40px); border:1px solid var(--line); } }
@media(max-width:380px) { header { padding:12px; gap:8px; } .avatar { display:none; } .bubble { max-width:96%; } }
</style>
</head>
<body>
<main>
  <header><div class="avatar" aria-hidden="true">J</div><div><h1>Jarvis</h1><p>Conversación del Paseo Aranjuez</p></div><button id="restart" type="button">Reiniciar</button></header>
  <div class="notice">Modo demo · Vista local de respaldo. No envía mensajes a WhatsApp. <a href="/catalog/demo">Acerca de los datos</a> · <a href="/kiosk/">Abrir kiosco</a></div>
  <section id="messages" role="log" aria-live="polite" aria-label="Conversación con Jarvis"><div class="bubble">¡Hola! Soy Jarvis. ¿Qué te gustaría encontrar hoy: una tienda, algo para comer o un regalo?</div></section>
  <div id="choices" aria-label="Opciones de conversación"></div>
  <form><input id="message" aria-label="Mensaje para Jarvis" placeholder="Escribe un mensaje…" maxlength="2000" autocomplete="off"><button id="send" type="submit">Enviar</button></form>
  <div id="status" role="status">Respaldo local listo</div>
</main>
<script>
const messages=document.getElementById('messages'), input=document.getElementById('message'), choices=document.getElementById('choices'), status=document.getElementById('status');
let session=crypto.randomUUID(), pending=null, busy=false;
function bubble(text,kind='') { const node=document.createElement('div'); node.className='bubble '+kind; node.textContent=text; messages.append(node); messages.scrollTop=messages.scrollHeight; }
function options(items) { choices.replaceChildren(); for(const text of items) { const button=document.createElement('button'); button.type='button'; button.textContent=text; button.disabled=busy; button.onclick=()=>send(text); choices.append(button); } }
function setBusy(value) { busy=value; document.getElementById('send').disabled=value; document.getElementById('restart').disabled=value; for(const button of choices.children)button.disabled=value; }
async function send(text,retry=false) {
  if(busy || !text.trim())return;
  setBusy(true);
  if(!retry) { pending={message:text.trim(),message_id:crypto.randomUUID(),session_id:session}; bubble(text,'user'); input.value=''; }
  status.textContent='Jarvis está respondiendo…';
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),12000);
  try {
    const response=await fetch('/whatsapp/demo/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending),signal:controller.signal});
    const result=await response.json(); if(!response.ok)throw new Error('unavailable');
    bubble(result.answer); pending=null; setBusy(false); options(result.suggestions || []); status.textContent='Respuesta recibida · canal local';
  } catch(error) {
    bubble('No pude recibir la respuesta. Reintenta o continúa en el kiosco.','error');
    setBusy(false); choices.replaceChildren(); const button=document.createElement('button'); button.type='button'; button.textContent='Reintentar mensaje'; button.onclick=()=>send(pending.message,true); choices.append(button);
    status.textContent='La conversación se conserva para reintentar.';
  } finally { clearTimeout(timer); setBusy(false); }
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();send(input.value);};
document.getElementById('restart').onclick=()=>{session=crypto.randomUUID(); pending=null; messages.replaceChildren();bubble('Empecemos de nuevo. ¿Qué te gustaría encontrar?'); options(['Busco una camisa','Quiero comer pizza','Ver promociones']);status.textContent='Conversación nueva';input.focus();};
options(['Busco una camisa','Quiero comer pizza','Ver promociones']);
</script>
</body>
</html>

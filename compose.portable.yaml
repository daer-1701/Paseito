# Standalone profile: no CUDA service or GPU reservation.
# Run with docker compose -f compose.portable.yaml up -d --build
name: paseo-jarvis
services:
  jarvis:
    build:
      context: .
      dockerfile: apps/jarvis-backend/Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_TIMEOUT_S: ${OPENAI_TIMEOUT_S:-8}
      PUNTOS_DATABASE_URL: ${PUNTOS_DATABASE_URL:-}
      PUNTOS_DB_CA: ${PUNTOS_DB_CA:-}
      PUNTOS_TIMEOUT_S: ${PUNTOS_TIMEOUT_S:-3}
      JARVIS_STIMULUS_ENABLED: ${JARVIS_STIMULUS_ENABLED:-0}
      JARVIS_TTS_PROVIDER: ${JARVIS_TTS_PROVIDER:-local}
      JARVIS_DEMO_CATALOG: ${JARVIS_DEMO_CATALOG:-1}
      JARVIS_INGEST_TOKEN: ${JARVIS_INGEST_TOKEN:?Set a local ingestion token before starting}
      JARVIS_KIOSK_ORIGIN: ${JARVIS_KIOSK_ORIGIN:-Punto del kiosco pendiente de configurar}
      JARVIS_MOBILE_BASE_URL: ${JARVIS_MOBILE_BASE_URL:-}
      JARVIS_WHATSAPP_PROVIDER: disabled
    ports:
      - "127.0.0.1:${JARVIS_PUBLIC_PORT:-8000}:8000"
    volumes:
      - jarvis-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  jarvis-data:

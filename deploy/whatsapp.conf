server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;
    location = /whatsapp/webhook {
        limit_except POST { deny all; }
        proxy_pass http://jarvis:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 12s;
        proxy_connect_timeout 3s;
    }
    location / { return 404; }
}

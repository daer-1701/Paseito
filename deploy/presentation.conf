limit_req_zone $binary_remote_addr zone=paseito_requests:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=paseito_connections:10m;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    # Only the dedicated local tunnel connects to this loopback-bound gateway.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    # Cloudflare supplies the original browser scheme; localhost probes have none.
    if ($http_x_forwarded_proto = http) {
        return 308 https://jarvis.timosboy.win$request_uri;
    }

    location ~ ^/(admin|analitica|stimulus)(/|$) { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }
    location ~ ^/(\.env|\.git)(/|$) { return 404; }

    location ~ ^/(chat(/[^/]+)?|voice/(status|transcribe|synthesize|stream)|catalog(/demo)?|kiosk/config|points/(programa|personal|session(/touch|/end)?)|cupones/(status|verificar)|destination/[^/]+|qr/destination/[^/]+|whatsapp/(status|demo(/message)?|webhook)|lugares|productos|promociones|eventos|faqs|health|salud)$ {
        limit_req zone=paseito_requests burst=12 nodelay;
        limit_conn paseito_connections 6;
        proxy_pass http://jarvis:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_cookie_flags paseito_points secure;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
    }

    # Static files only: never turn an arbitrary path into a proxied API request.
    location ~ ^/(kiosk/)?(js|vendor|assets|img)/.+\.(js|mjs|glb|png|jpg|jpeg|webp|svg|css|woff2?)$ {
        limit_except GET { deny all; }
        proxy_pass http://jarvis:8000;
        proxy_set_header Host $host;
    }
    location = / {
        limit_except GET { deny all; }
        proxy_pass http://jarvis:8000;
        proxy_set_header Host $host;
    }
    location = /kiosk { return 302 /; }
    location = /kiosco { return 302 /; }
    location / { return 404; }
}

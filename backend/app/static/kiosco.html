<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paseito · Paseo Aranjuez</title>
<style>
  :root { --oro: #e7b73a; --vino: #7a1f3d; --texto: #fffaf0; --panel: rgba(20, 12, 18, .72); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: var(--texto); }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
  main { height: 100%; display: grid; grid-template-columns: 1fr minmax(260px, 340px); gap: 16px; padding: 20px; }
  #centro { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 0; }
  #avatar { width: min(100%, 58vh); flex: 1; min-height: 0; display: flex; align-items: flex-end; }
  #avatar svg { width: 100%; height: 100%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.35)); }
  #nombre { margin-top: -6px; padding: 6px 18px; border-radius: 999px; background: var(--vino);
            border: 2px solid var(--oro); font-weight: 700; letter-spacing: .5px; }
  #subtitulo { margin-top: 14px; width: min(100%, 760px); min-height: 92px; padding: 14px 20px; border-radius: 16px;
               background: var(--panel); backdrop-filter: blur(6px); font-size: clamp(1rem, 2.1vh, 1.35rem); line-height: 1.45; }
  #oyente { color: #f3d98a; font-size: .85em; min-height: 1.3em; }
  #controles { margin-top: 14px; display: flex; gap: 12px; align-items: center; width: min(100%, 760px); }
  #microfono { flex: none; width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; cursor: pointer;
               background: var(--oro); font-size: 2rem; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #microfono.escuchando { background: #e5484d; animation: pulso 1s infinite; }
  @keyframes pulso { 50% { transform: scale(1.08); } }
  #texto { flex: 1; padding: 14px 16px; border-radius: 12px; border: none; font: inherit; background: rgba(255,255,255,.92); color: #222; }
  #estado { font-size: .85rem; opacity: .85; min-width: 110px; }
  aside { background: var(--panel); backdrop-filter: blur(6px); border-radius: 16px; padding: 16px; overflow-y: auto; }
  aside h2 { margin: 0 0 10px; font-size: 1rem; color: var(--oro); letter-spacing: .5px; }
  .tarjeta { background: rgba(255,255,255,.08); border-left: 4px solid var(--oro); border-radius: 10px;
             padding: 10px 12px; margin-bottom: 10px; animation: entra .3s ease; }
  .tarjeta b { display: block; font-size: 1.02rem; }
  .tarjeta small { display: block; opacity: .85; margin-top: 3px; }
  .chip { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
  .abierto { background: #1f9d55; } .cerrado { background: #b42318; }
  @keyframes entra { from { opacity: 0; transform: translateX(12px); } }
  #inicio { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,6,10,.55); cursor: pointer; z-index: 5; }
  #inicio div { text-align: center; padding: 28px 36px; border-radius: 20px; background: var(--vino); border: 3px solid var(--oro); }
  #inicio h1 { margin: 0 0 6px; } #inicio p { margin: 0; opacity: .9; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>

<!-- Cochabamba: cordillera del Tunari y el Cristo de la Concordia sobre el cerro San Pedro -->
<svg id="escena" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7cc4"/><stop offset=".55" stop-color="#8fc0e8"/><stop offset="1" stop-color="#f6d7a7"/>
    </linearGradient>
    <linearGradient id="tunari" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6f9e"/><stop offset="1" stop-color="#8a86a8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#cielo)"/>
  <circle cx="1320" cy="170" r="70" fill="#fff3c4" opacity=".9"/>
  <path d="M0 520 L140 400 L230 450 L360 300 L470 380 L560 330 L700 220 L820 330 L930 280 L1040 360 L1160 290 L1290 380 L1420 330 L1600 420 L1600 900 L0 900 Z" fill="url(#tunari)"/>
  <path d="M640 270 L700 220 L760 280 L728 268 L700 290 L672 266 Z M320 335 L360 300 L398 340 L372 330 L360 345 Z M1125 315 L1160 290 L1196 322 L1170 316 Z" fill="#f4f6fb"/>
  <path d="M0 640 Q300 560 620 610 T1250 600 T1600 620 L1600 900 L0 900 Z" fill="#7a9a5a"/>
  <path d="M900 660 Q1030 500 1150 520 Q1300 550 1420 660 L1420 900 L860 900 Z" fill="#8c7a52"/>
  <g transform="translate(1085 452) scale(.62)" fill="#f4f1ea">
    <rect x="-22" y="70" width="44" height="40"/>
    <path d="M-12 70 L-9 -40 L9 -40 L12 70 Z"/>
    <path d="M-62 -36 Q0 -46 62 -36 L60 -26 Q0 -34 -60 -26 Z"/>
    <circle cx="0" cy="-54" r="11"/>
  </g>
  <g fill="#5b4a3c" opacity=".55">
    <rect x="80" y="690" width="70" height="80"/><rect x="160" y="660" width="50" height="110"/><rect x="220" y="700" width="90" height="70"/>
    <rect x="1240" y="680" width="60" height="90"/><rect x="1310" y="650" width="40" height="120"/><rect x="1360" y="700" width="90" height="70"/>
  </g>
  <rect y="770" width="1600" height="130" fill="#3e2a22" opacity=".35"/>
</svg>

<main>
  <section id="centro">
    <div id="avatar"></div>
    <div id="nombre">Paseito · Paseo Aranjuez</div>
    <div id="subtitulo">
      <div id="oyente"></div>
      <div id="respuesta">¡Hola! Toca el micrófono y pregúntame por tiendas, comida, eventos o servicios del Paseo.</div>
    </div>
    <div id="controles">
      <button id="microfono" title="Hablar">🎤</button>
      <input id="texto" placeholder="O escribe tu pregunta…" autocomplete="off">
      <span id="estado"></span>
    </div>
  </section>
  <aside>
    <h2>LO QUE ENCONTRÉ</h2>
    <div id="tarjetas"></div>
  </aside>
</main>

<div id="inicio">
  <div>
    <h1>¡Hola! 👋</h1>
    <p>Toca la pantalla para conversar con Paseito</p>
  </div>
</div>

<script type="module">
import { Avatar } from "/static/avatar.js";

const SALUDO = "¡Hola! Soy Paseito, tu asistente del Paseo Aranjuez. ¿En qué te puedo ayudar hoy?";
const $ = (id) => document.getElementById(id);
const avatar = new Avatar($("avatar"));
window.avatar = avatar;
let sessionId = null;
let turno = 0;

function estado(texto, modo = "normal") {
  $("estado").textContent = texto;
  avatar.estado = modo;
}

// ---------- Voz: Gemini por frases en paralelo, con la del navegador de respaldo ----------
function dividirFrases(texto) {
  const unidas = [];
  for (const f of texto.split(/(?<=[.!?…])\s+/).map(s => s.trim()).filter(Boolean)) {
    if (unidas.length && unidas[unidas.length - 1].length < 40) unidas[unidas.length - 1] += " " + f;
    else unidas.push(f);
  }
  return unidas;
}

async function pedirAudio(texto) {
  const r = await fetch("/voz", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto }),
  });
  if (!r.ok) throw new Error(r.status);
  return URL.createObjectURL(await r.blob());
}

function vozNavegador(texto) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(texto);
    const voces = speechSynthesis.getVoices().filter(v => v.lang.startsWith("es"));
    u.voice = voces.find(v => /419|MX|US/.test(v.lang)) || voces[0] || null;
    u.lang = u.voice?.lang || "es-419";
    u.onstart = () => avatar.hablarSimulado(true);
    u.onend = u.onerror = () => { avatar.hablarSimulado(false); resolve(); };
    speechSynthesis.speak(u);
  });
}

async function hablar(texto) {
  const miTurno = ++turno;
  const frases = dividirFrases(texto);
  const audios = frases.map(f => pedirAudio(f));
  for (let i = 0; i < frases.length; i++) {
    let url = null;
    try { url = await audios[i]; } catch { /* esa frase va con la voz del navegador */ }
    if (miTurno !== turno) return;
    estado("");
    if (url) await avatar.hablarAudio(url);
    else await vozNavegador(frases[i]);
  }
}

function callar() {
  turno++;
  speechSynthesis.cancel();
  avatar.callar();
}

// ---------- Tarjetas ----------
function tarjetaHtml(t) {
  const u = t.ubicacion || t.tienda || {};
  const donde = [u.piso, u.local && `local ${u.local}`, u.sector].filter(Boolean).join(" · ");
  if (t.tipo === "lugar") {
    const chip = t.abierto_ahora == null ? "" :
      `<span class="chip ${t.abierto_ahora ? "abierto" : "cerrado"}">${t.abierto_ahora ? "Abierto" : "Cerrado"}</span>`;
    return `<b>${t.nombre}</b><small>${t.categoria || ""}</small><small>📍 ${donde || "Paseo Aranjuez"}</small>
            ${t.horario ? `<small>🕒 ${t.horario}</small>` : ""}${chip}`;
  }
  if (t.tipo === "producto") return `<b>${t.nombre}</b><small>Bs ${t.precio_bs} · ${t.tienda?.nombre || ""}</small><small>📍 ${donde}</small>`;
  if (t.tipo === "promocion") return `<b>${t.titulo}</b><small>${t.descripcion || ""}</small><small>${t.tienda?.nombre || ""}</small>`;
  if (t.tipo === "evento") return `<b>${t.nombre}</b><small>📅 ${t.fecha} · ${t.hora_inicio || ""}</small><small>📍 ${t.lugar || ""}</small>`;
  return `<b>${t.pregunta || t.nombre || ""}</b><small>${t.respuesta || ""}</small>`;
}

function mostrarTarjetas(tarjetas) {
  $("tarjetas").innerHTML = tarjetas.slice(0, 6).map(t => `<div class="tarjeta">${tarjetaHtml(t)}</div>`).join("");
}

// ---------- Conversación ----------
async function preguntar(texto) {
  texto = texto.trim();
  if (!texto) return;
  callar();
  $("oyente").textContent = "Tú: " + texto;
  $("respuesta").textContent = "…";
  estado("Pensando…", "pensando");
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto, session_id: sessionId }),
    });
    const datos = await r.json();
    if (!r.ok) throw new Error(datos.detail || r.status);
    sessionId = datos.session_id;
    $("respuesta").textContent = datos.respuesta;
    if (datos.tarjetas.length) mostrarTarjetas(datos.tarjetas);
    estado("Preparando voz…", "normal");
    await hablar(datos.respuesta);
  } catch (e) {
    $("respuesta").textContent = "Disculpa, tuve un problema. ¿Puedes repetirlo?";
    estado("");
  }
}

$("texto").onkeydown = (e) => {
  if (e.key === "Enter") { preguntar($("texto").value); $("texto").value = ""; }
};

$("inicio").onclick = () => {
  $("inicio").remove();
  avatar.desbloquear();
  $("respuesta").textContent = SALUDO;
  hablar(SALUDO);
};

// ---------- Micrófono ----------
const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Reconocimiento) {
  $("microfono").disabled = true;
  $("microfono").title = "Usa Chrome o Edge para hablar";
} else {
  const rec = new Reconocimiento();
  rec.lang = "es-BO";
  rec.interimResults = true;
  let escuchando = false;
  rec.onstart = () => { escuchando = true; $("microfono").classList.add("escuchando"); estado("Escuchando…", "escuchando"); };
  rec.onend = () => { escuchando = false; $("microfono").classList.remove("escuchando"); if (avatar.estado === "escuchando") estado(""); };
  rec.onerror = (e) => estado("Micrófono: " + e.error);
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    $("oyente").textContent = "Tú: " + r[0].transcript;
    if (r.isFinal) preguntar(r[0].transcript);
  };
  $("microfono").onclick = () => {
    avatar.desbloquear();
    if (escuchando) return rec.stop();
    callar();
    rec.start();
  };
}
</script>
</body>
</html>

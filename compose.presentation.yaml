services:
  presentation:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      jarvis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JARVIS_PRESENTATION_PORT:-8082}:8080"
    volumes:
      - ./deploy/presentation.conf:/etc/nginx/conf.d/default.conf:ro
